name: amerike_investment_sim
description: Sistema de simulación de inversiones para Amerike MBA 2026
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # WebSocket
  web_socket_channel: ^2.4.5
  shelf: ^1.4.1
  shelf_web_socket: ^1.0.4

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  logging: ^1.2.0

  # Database
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.8.3

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Testing
  # sqflite_common_ffi ya está en dependencies

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
